# SENTINEL-6 — local multi-agent market desk (PAPER TRADING ONLY)

account:
  base_currency: INR            # INR or USD — all P&L / risk shown in this
  starting_equity: 1000000      # ₹10,00,000

# ------------------------------------------------------------------ segments
# universe: full  -> every listed instrument, liquidity pre-screened once a day
# universe: list  -> only the `symbols` given (also used by --demo)
universe_refresh_hours: 20      # rebuild symbol lists + pre-screen + 2y history this often

segments:
  us_spot:
    enabled: true
    top_n: 5                    # picks passed to the desk each cycle
    universe: full              # NYSE + Nasdaq + AMEX (NASDAQ Trader symbol files)
    include_etfs: false
    min_price: 5                # USD
    min_adv: 20000000           # 20-day avg traded value, USD ($20M)
    fractional: true            # INDmoney allows fractional US shares
    symbols: [AAPL, NVDA, MSFT, AMZN, TSLA, META, GOOGL, AMD, AVGO, NFLX]

  in_spot:
    enabled: true
    top_n: 5
    universe: full              # every NSE EQ-series stock (EQUITY_L.csv)
    min_price: 20               # INR
    min_adv: 100000000          # 20-day avg traded value, INR (₹10 cr)
    symbols: [RELIANCE.NS, HDFCBANK.NS, ICICIBANK.NS, INFY.NS, TCS.NS, SBIN.NS,
              BHARTIARTL.NS, LT.NS, ITC.NS, AXISBANK.NS, KOTAKBANK.NS, TATAMOTORS.NS]

  crypto_spot:
    enabled: true
    top_n: 4
    universe: full              # every Binance spot USDT pair (stablecoins / leveraged tokens excluded)
    min_adv: 5000000            # 24h quote volume, USD ($5M)
    fractional: true
    symbols: [BTC-USD, ETH-USD, SOL-USD, BNB-USD, XRP-USD, ADA-USD, DOGE-USD, AVAX-USD, LINK-USD]

  in_fno:
    enabled: true
    top_n: 4
    universe: full              # every NSE F&O underlying (lot sizes from NSE)
    indices: [NIFTY, BANKNIFTY, FINNIFTY, MIDCPNIFTY, NIFTYNXT50]
    instrument: options         # options | futures  (options falls back to futures if no chain)
    min_dte: 3                  # skip expiries closer than this (days)
    max_dte: 45

  crypto_fut:
    enabled: true
    top_n: 4
    universe: full              # every Delta Exchange India perpetual
    min_adv: 1000000            # 24h turnover, USD ($1M)

  crypto_opt:
    enabled: true
    top_n: 2
    universe: full              # every underlying Delta lists options on
    min_strikes: 10
    underlyings: [BTC, ETH]     # used when universe: list / demo
    min_dte: 2
    max_dte: 35

# ------------------------------------------------------------------ options logic
options:
  iv_cheap: 1.10               # ATM IV / 20d realised vol <= this -> buy call/put
  iv_rich: 1.50                # >  this -> credit spread; in between -> debit spread
  min_pop_credit: 0.60         # credit spreads need >= 60% prob. (realised vol) short strike expires OTM
  rate_in: 0.065               # risk-free for NSE option model
  rate_crypto: 0.0

# News / social search names (anything missing uses the symbol)
aliases:
  NIFTY: Nifty 50
  BANKNIFTY: Bank Nifty
  FINNIFTY: Nifty Financial Services
  MIDCPNIFTY: Nifty Midcap Select
  NIFTYNXT50: Nifty Next 50
  BTC: Bitcoin
  ETH: Ethereum
  SOL: Solana
  XRP: XRP Ripple
  DOGE: Dogecoin
  BNB: BNB crypto
  ADA: Cardano
  AVAX: Avalanche crypto
  LINK: Chainlink
  AAPL: Apple
  NVDA: Nvidia
  MSFT: Microsoft
  AMZN: Amazon
  TSLA: Tesla
  META: Meta Platforms
  GOOGL: Alphabet Google
  AVGO: Broadcom
  NFLX: Netflix
  RELIANCE: Reliance Industries
  HDFCBANK: HDFC Bank
  ICICIBANK: ICICI Bank
  INFY: Infosys
  TCS: Tata Consultancy Services
  SBIN: State Bank of India
  BHARTIARTL: Bharti Airtel
  LT: Larsen & Toubro
  ITC: ITC Ltd
  AXISBANK: Axis Bank
  KOTAKBANK: Kotak Mahindra Bank
  TATAMOTORS: Tata Motors

# 1) KESTREL — market scanner
kestrel:
  history: 2y
  min_score: 25

# 2) PRISM — chart technician
prism:
  atr_stop_mult: 1.5
  target_rr: 2.5
  sr_lookback: 20
  weights:                     # PRISM chart score components (sum = 1)
    trend: 0.28                # EMA 20/50/200 stack
    price_vs_ema20: 0.12
    macd: 0.15                 # MACD histogram
    kst: 0.15                  # Know Sure Thing vs its signal line (10/15/20/30, 10/10/10/15, 9)
    rsi: 0.15
    volume: 0.15

# 3) HERALD — news desk
herald:
  max_age_hours: 72
  google_news: true

# 4) PULSE — crowd + derivatives positioning
pulse:
  reddit: true
  stocktwits: true
  apewisdom: true             # Reddit/4chan mention counts (free API) for mention velocity
  hype_velocity: 3.0
  hype_extension_atr: 2.0
  positioning_weight: 0.5      # share of PULSE score from PCR / funding / OI when available

# 5) AEGIS — risk officer (veto power)
aegis:
  risk_per_trade_pct: 1.0      # max loss per trade, % equity
  max_position_pct: 20.0       # max notional (premium/margin for options) per position, % equity
  max_gross_pct: 300.0
  max_positions: 20
  max_correlation: 0.75
  max_segment_pct:             # notional cap per segment, % equity
    us_spot: 40
    in_spot: 40
    crypto_spot: 30
    in_fno: 100
    crypto_fut: 60
    crypto_opt: 20
  min_rr:                      # reward:risk needed, by structure
    SPOT: 2.0
    FUTURE: 2.0
    LONG_OPTION: 2.0
    DEBIT_SPREAD: 1.5
    CREDIT_SPREAD: 0.10         # credit spreads must also pass POP + positive EV (realised vol)

# 6) ARBITER — final decision
arbiter:
  weights: {kestrel: 0.15, prism: 0.40, herald: 0.25, pulse: 0.20}
  trade_threshold: 0.35
  conflict_threshold: -0.30

llm:
  enabled: false
  url: http://localhost:11434/api/generate
  model: llama3.1:8b

http_timeout: 10
